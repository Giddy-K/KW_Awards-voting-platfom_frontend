name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: there is intentionally no deploy job. The previous GitHub Pages deploy
# workflow was removed; hosting is decided in Phase 4.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api

      - name: Dependency audit (fails on high or critical, runtime deps)
        run: npm audit --omit=dev --audit-level=high
